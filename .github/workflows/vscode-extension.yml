name: VS Code extension

on:
  push:
    paths:
      - "extensions/context-workspace/**"
      - "scripts/package-vscode-extension.sh"
      - "scripts/verify-vscode-extension.sh"
      - "scripts/verify-vsix.py"
      - "scripts/normalize-vsix.py"
      - "tests/vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "extensions/context-workspace/**"
      - "scripts/package-vscode-extension.sh"
      - "scripts/verify-vscode-extension.sh"
      - "scripts/verify-vsix.py"
      - "scripts/normalize-vsix.py"
      - "tests/vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/context-workspace/package-lock.json
      - name: Verify and package
        run: bash scripts/verify-vscode-extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: context-workspace-vsix
          path: dist/context-workspace-*.vsix
          if-no-files-found: error
