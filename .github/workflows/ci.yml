name: CI

# Deterministic proof the pipeline holds together — runs on every push/PR with
# no API key and no `claude` CLI. The LLM build phase is skipped (--no-build);
# CI verifies the committed smoke artifacts (C1–C5) plus the R1–R19 regression
# guards (body-hash idempotence, installer, typed-relations, citation floor, …).
#
# The full end-to-end run that actually drives `claude -p` (extract → ingest →
# query, and the newcomer onboarding eval) is scripts/smoke-all.sh /
# scripts/eval-onboarding.sh — run locally where the agentic tool is installed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke + regression guards (no LLM)
    runs-on: ubuntu-latest
    # Gate LOCALE-INVARIANT. These scripts are authored on macOS (BSD awk) and
    # run here on gawk/mawk. `wiki-lint-typed-relations.sh` built an em-dash via
    # sprintf("%c%c%c",226,128,148) and matched it with index(): three raw bytes
    # under a byte locale, three multi-byte codepoints under UTF-8 — R7 green
    # locally, red here, invisible until the PR ran. A static "non-ASCII near
    # awk/sed" linter cannot separate the awk PROGRAM from the shell string
    # around it (it flags 23 files here, every one a false positive), so this
    # detects the actual failure instead of the smell: run the whole suite under
    # both locales and require identical results. Divergence = locale-dependent
    # behaviour, wherever it lives.
    strategy:
      fail-fast: false
      matrix:
        locale: [C, C.UTF-8]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          bash --version | head -1
          openssl version
          python3 --version
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          locale
      - name: Run the deterministic checks (C1–C5 + R1–R46) under LC_ALL=${{ matrix.locale }}
        env:
          LC_ALL: ${{ matrix.locale }}
        # shell: bash gives GitHub's `bash --noprofile --norc -eo pipefail`. Without
        # pipefail the exit status of `smoke-all.sh | tee` is TEE's, which is always 0
        # — so a red suite reported this job green, and only the LOCALE-INVARIANT job
        # (which needs the "All N checks green" line) noticed anything was wrong.
        shell: bash
        run: bash scripts/smoke-all.sh --no-build | tee "smoke-${{ matrix.locale }}.log"
      - name: Upload pass tally
        if: always()   # the tally is most needed when the suite FAILED
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tally-${{ matrix.locale }}
          path: smoke-${{ matrix.locale }}.log

  locale-invariant:
    name: LOCALE-INVARIANT (both locales agree)
    needs: smoke
    if: always()   # see below — divergence matters MOST when a leg is red
    runs-on: ubuntu-latest
    # `needs: smoke` already fails the build if either locale goes red. This job
    # closes the remaining hole: both legs green but with DIFFERENT pass counts,
    # which is the same locale bug wearing a green tick.
    #
    # `if: always()` because until 2026-08-24 the smoke step swallowed its exit
    # status through `| tee`, so both legs ALWAYS reported success and this job
    # always ran. With the status now propagating, a single red leg would skip
    # this comparison — losing the tally diff at the exact moment one locale
    # disagrees with the other, which is the case it exists to describe.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-tally-*
          merge-multiple: true
      - name: Compare pass tallies
        run: |
          set -euo pipefail
          # A clean run prints "All N checks green"; a failing one never does. Fall
          # back to counting pass marks so the comparison still works on a red
          # run — otherwise this job dies on an empty grep and says nothing.
          tally() {
            grep -oE 'All [0-9]+ checks green' "$1" 2>/dev/null | grep -oE '[0-9]+' \
              || grep -c '^✓' "$1" 2>/dev/null \
              || echo 0
          }
          a=$(tally smoke-C.log | head -1)
          b=$(tally smoke-C.UTF-8.log | head -1)
          echo "LC_ALL=C: $a passes / LC_ALL=C.UTF-8: $b passes"
          if [ "$a" != "$b" ]; then
            echo "LOCALE-INVARIANT: the suite counts a different number of passes per locale." >&2
            echo "Some check is byte-oriented under one locale and codepoint-oriented under" >&2
            echo "the other. FIX: force LC_ALL=C on the awk/sed that manipulates non-ASCII." >&2
            exit 1
          fi
          echo "LOCALE-INVARIANT: clean — identical results under both locales."

  quality:
    name: shell + duplication quality gate
    # fallow-equivalent gate for a shell+markdown repo (fallow itself is TS/JS-
    # or Python-only and sees nothing here). shellcheck + jscpd; no LLM, no key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (error severity)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
      - name: Duplication + dead-script scan
        run: bash scripts/quality.sh --ci
